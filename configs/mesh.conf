# UMP Mesh Configuration

[protocol]
version=1.0
encryption=true
fragmentation=true
resumable_transfers=true

[transport]
preferred=MESH,LORA,WIFI,BLUETOOTH
fallback=true

[mesh]
enabled=true
relay=true
store_and_forward=true
route_discovery=true
multi_hop=true

[routing]
mode=mesh
max_hops=16
avoid_duplicate_packets=true

[security]
identity_ratchet=true
session_ratchet=true
message_ratchet=true
transport_ratchet=true
