# UMP Low-Bandwidth Configuration

[protocol]
version=1.0
encryption=true
fragmentation=true
compression=true
resumable_transfers=true

[transport]
preferred=LORA,MESH,SMS
fallback=true

[optimization]
small_packets=true
adaptive_chunking=true
compression=true
minimize_metadata=true

[media]
automatic_downscale=true
prefer_text=true
defer_large_files=true

[routing]
mode=store-and-forward
relay=true
mesh=true
