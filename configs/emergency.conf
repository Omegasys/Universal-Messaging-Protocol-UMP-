# UMP Emergency Configuration

[protocol]
version=1.0
encryption=true
fragmentation=true
compression=true

[transport]
preferred=SATELLITE,SMS,LORA,MESH,RCS
fallback=true

[routing]
mode=emergency
relay=true
mesh=true
store_and_forward=true
multi_hop=true

[emergency]
priority=critical
retry=true
acknowledgement=true
delivery_receipts=true
offline_queue=true

[optimization]
small_packets=true
minimize_metadata=true
prefer_text=true
defer_attachments=true

[security]
identity_ratchet=true
session_ratchet=true
message_ratchet=true
transport_ratchet=true
