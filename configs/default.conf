# UMP Default Configuration

[protocol]
version=1.0
max_file_size=10737418240
encryption=true
compression=true
fragmentation=true
resumable_transfers=true

[message]
text=true
media=true
groups=true
reactions=true
presence=true
receipts=true

[security]
identity_ratchet=true
session_ratchet=true
message_ratchet=true
transport_ratchet=true

[transport]
preferred=WIFI,TCP,RCS
fallback=true

[routing]
mode=auto
relay=true
mesh=true
