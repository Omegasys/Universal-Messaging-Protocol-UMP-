# UMP Cellular Configuration

[protocol]
version=1.0
max_file_size=10737418240
encryption=true
fragmentation=true
resumable_transfers=true

[transport]
preferred=RCS,MMS,SMS
fallback=true

[cellular]
sms=true
mms=true
rcs=true

[routing]
mode=cellular
relay=true
mesh=false

[optimization]
compression=true
adaptive_chunking=true
